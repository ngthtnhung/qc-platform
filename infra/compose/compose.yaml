# QC Platform — Docker Compose (Phase 1)
# Dev : docker compose -f infra/compose/compose.yaml --env-file .env up -d --build
# Team: thêm --profile team (TLS qua Caddy; cần APP_ENV=team, COOKIE_SECURE=true, PUBLIC_HOST)
name: qc-platform

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Đặt POSTGRES_USER trong .env}:${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}@postgres:5432/${POSTGRES_DB:?Đặt POSTGRES_DB trong .env}
  REDIS_URL: redis://redis:6379/0
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Đặt JWT_SIGNING_KEY (>= 32 ký tự) trong .env}
  SECRET_KEK: ${SECRET_KEK:?Đặt SECRET_KEK (base64 của 32 byte) trong .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: /data/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}

x-api-build: &api-build
  context: ../..
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: *api-build
    image: qc-platform-api:dev
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: qc-platform-api:dev
    pull_policy: never  # image build cục bộ bởi service migrate; tránh thông báo 'pull access denied' gây nhầm
    environment: *api-env
    volumes: ["storage-data:/data/storage"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    image: qc-platform-api:dev
    pull_policy: never  # image build cục bộ bởi service migrate; tránh thông báo 'pull access denied' gây nhầm
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "default,ai,sync,indexing,automation_post", "--loglevel=INFO"]
    environment: *api-env
    volumes: ["storage-data:/data/storage"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  beat:
    image: qc-platform-api:dev
    pull_policy: never  # image build cục bộ bởi service migrate; tránh thông báo 'pull access denied' gây nhầm
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    # beat không có endpoint HTTP: PID 1 còn sống là tín hiệu duy nhất (không kế thừa healthcheck HTTP của image API)
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  runner-docker:
    profiles: ["runner"]
    build:
      context: ../..
      dockerfile: apps/runner-agent/Dockerfile
    environment:
      QC_SERVER_URL: http://api:8000
      RUNNER_ALLOW_HTTP: "1"  # chỉ vì api nằm trong mạng nội bộ Docker Compose; runner ngoài compose phải dùng https
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_SKIP_LOGIN: ${RUNNER_SKIP_LOGIN:-}  # CHỈ để kiểm thử giao thức trên máy dev; để trống ở môi trường thật
    # Chromium trong Docker cần --ipc=host hoặc shm lớn hơn; không mount docker.sock, không privileged
    shm_size: "1gb"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  proxy:
    image: caddy:2
    profiles: ["team"]
    command: ["caddy", "reverse-proxy", "--from", "${PUBLIC_HOST:-localhost}", "--to", "web:3000"]
    ports: ["443:443", "80:80"]
    volumes: ["caddy-data:/data"]
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  storage-data:
  minio-data:
  caddy-data:
